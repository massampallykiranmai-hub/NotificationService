services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notifications
      MYSQL_USER: notif
      MYSQL_PASSWORD: notif
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - notif-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "notif", "-pnotif"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notifications
      SPRING_DATASOURCE_USERNAME: notif
      SPRING_DATASOURCE_PASSWORD: notif
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  notif-db-data:
